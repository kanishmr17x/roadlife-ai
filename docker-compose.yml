version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: roadlife_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: roadlife_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - roadlife-net

  express-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.express
    container_name: roadlife_express_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/roadlife_db
      - JWT_SECRET=${JWT_SECRET:-roadlife-ai-development-secret-jwt-key-2026}
      - ML_SERVICE_URL=http://ai-service:8001
    depends_on:
      - mongodb
    networks:
      - roadlife-net

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ml
    container_name: roadlife_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - YOLO_OFFLINE=1
    networks:
      - roadlife-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: roadlife_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - express-api
    networks:
      - roadlife-net

volumes:
  mongodb_data:

networks:
  roadlife-net:
    driver: bridge
