name: RoadLife AI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  frontend-ci:
    name: Frontend (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
      - name: Type-Check & Build Frontend
        run: |
          cd frontend
          npm run build

  backend-ci:
    name: Backend API (Express + MongoDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/express-api/package-lock.json
      - name: Install Backend Dependencies
        run: |
          cd backend/express-api
          npm ci
      - name: Run Backend Offline Test Suite
        run: |
          cd backend/express-api
          npm test

  ai-service-ci:
    name: AI Microservice (FastAPI + YOLOv8 + PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install AI Dependencies
        run: |
          cd backend/ai-service
          pip install --no-cache-dir -r requirements.txt
      - name: Run PyTest Suite
        run: |
          cd backend/ai-service
          python -m pytest tests -v
